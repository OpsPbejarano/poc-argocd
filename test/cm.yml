apiVersion: v1
kind: ConfigMap
metadata:
  name: dummy-service-config
  namespace: default
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "debug"
  DB_HOST: "postgres.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "dummy_db"
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-service
  namespace: default
  labels:
    app: dummy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-service
  template:
    metadata:
      labels:
        app: dummy-service
    spec:
      containers:
        - name: dummy-service
          image: nginx:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dummy-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-service
  namespace: default
  labels:
    app: dummy-service
spec:
  selector:
    app: dummy-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
